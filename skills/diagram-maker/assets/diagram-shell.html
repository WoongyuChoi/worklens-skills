<title id="title">요청 확인부터 검증과 수정까지</title><desc id="desc">요청 확인 후 구현하고 검증한다. 통과하면 완료, 실패하면 수정 후 다시 검증한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#39647a"/></marker></defs>

<path class="edge" marker-end="url(#arrow)" d="M345 425H285V175H335"/>
<rect class="node" x="45" y="85" width="190" height="90" rx="12"/><text x="140" y="139" text-anchor="middle">요청 확인</text>
<rect class="node" x="335" y="85" width="190" height="90" rx="12"/><text x="430" y="139" text-anchor="middle">구현</text>

<rect class="node" x="345" y="385" width="210" height="80" rx="12"/><text x="450" y="434" text-anchor="middle">수정</text>
<text x="645" y="312" text-anchor="middle">통과</text><text x="645" y="413" text-anchor="middle">실패</text>
</svg></div><p class="note">예시 도식입니다. 실제 결과물에서는 확인한 업무 단계와 연결 근거로 교체합니다.</p></main></body></html>
